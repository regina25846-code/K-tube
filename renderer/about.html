<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>K-Tube 정보</title>
<style>

/* ═══════════════════════════════════════════════════════════
   K-SERIES ABOUT DIALOG — "Spatial Light Glass" (compact)
   다운로드 페이지와 같은 세계관: 반투명 유리 + 프리즘 헤어라인
   + 레이어드 그림자 + 그라디언트 버튼.
   앱별로 갈아끼우는 건 --tint / --tint-lite / --tint-deep 뿐.
   ═══════════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;user-select:none;
  font-family:'Pretendard','Pretendard Variable',
              'Malgun Gothic','Apple SD Gothic Neo','Segoe UI',sans-serif;
  letter-spacing:-.012em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}

/* ── 라이트 토큰(기본) ── */
:root{
  color-scheme:light;
  --ground:#EAEEF5; --ground-2:#DCE2EE;
  --glass:rgba(255,255,255,.44);
  --glass-solid:rgba(255,255,255,.84);
  --glass-inner:rgba(255,255,255,.50);
  --glass-line:rgba(18,28,54,.10);
  --glass-hi:rgba(255,255,255,.92);
  --hairline:rgba(18,28,54,.09);
  --ink:#141922; --ink-2:#525B6B; --ink-3:#8791A2;
  --lift:rgba(255,255,255,.95);
  --sheen:rgba(255,255,255,.55);
  --mesh-a:.58; --mesh-a2:.72;
  --prism-a:.6;
  --sh-near:0 1px 2px rgba(18,28,54,.09);
  --sh-mid:0 6px 16px -8px rgba(18,28,54,.24);
  --sh-far:0 14px 30px -8px rgba(18,28,54,.40);
  --ico-sh:0 1px 2px rgba(18,28,54,.16), 0 12px 22px -10px rgba(18,28,54,.34);
  --sh-ring:0 0 0 1px rgba(18,28,54,.13);
  --sh-amb:0 2px 10px -2px rgba(18,28,54,.16);
  --prism-start:color-mix(in srgb,var(--tint) 55%,transparent);
}
/* ── 다크 토큰 ── */
:root[data-theme="dark"], :root[data-theme="midnight"]{
  color-scheme:dark;
  --ground:#0C0F16; --ground-2:#151220;
  --glass:rgba(255,255,255,.055);
  --glass-solid:rgba(255,255,255,.095);
  --glass-inner:rgba(255,255,255,.045);
  --glass-line:rgba(255,255,255,.13);
  --glass-hi:rgba(255,255,255,.14);
  --hairline:rgba(255,255,255,.10);
  --ink:#EEF1F7; --ink-2:#A5AEBE; --ink-3:#737D91;
  --lift:rgba(255,255,255,.07);
  --sheen:rgba(255,255,255,.05);
  --mesh-a:.30; --mesh-a2:.16;
  --prism-a:.78;
  --sh-near:0 1px 2px rgba(0,0,0,.5);
  --sh-mid:0 7px 18px -8px rgba(0,0,0,.66);
  --sh-far:0 15px 32px -8px rgba(0,0,0,.78);
  --ico-sh:0 1px 2px rgba(0,0,0,.5), 0 14px 26px -10px rgba(0,0,0,.75);
  --sh-ring:0 0 0 1px rgba(255,255,255,.10);
  --sh-amb:0 2px 10px -2px rgba(0,0,0,.45);
  --prism-start:color-mix(in srgb,var(--tint-lite) 78%,transparent);
}

/* ── 다이얼로그 셸 ── */
.dlg{
  /* width:100%면 카드 폭이 "창 폭 - body padding"으로 따라 변해서, 그림자 여백을
     넓히는 순간 카드가 그만큼 좁아진다. 실제 배포 폭인 300px로 고정하고 창 폭은
     main.js의 ABOUT_W(=300+좌우 padding 56=356)가 맞춘다. */
  position:relative;width:300px;flex:none;
  border-radius:20px;overflow:hidden;
  background:linear-gradient(172deg,var(--ground) 0%,var(--ground-2) 100%);
  box-shadow:var(--sh-ring),var(--sh-amb),var(--sh-near),var(--sh-mid),var(--sh-far);
  display:flex;flex-direction:column;
  isolation:isolate;
}
/* 프리즘 헤어라인 — 다운로드 페이지 .glass::before와 동일 기법 */
.dlg::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  padding:1px;z-index:3;
  background:linear-gradient(135deg,
    var(--prism-start) 0%,
    var(--glass-line) 30%,
    var(--glass-line) 64%,
    color-mix(in srgb,var(--tint) 52%,transparent) 100%);
  opacity:var(--prism-a);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
          mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
/* 유리 뒤에서 번지는 오로라 — backdrop-filter가 실제로 흐릴 대상 */
.aura{
  position:absolute;inset:-16%;z-index:0;pointer-events:none;
  background:
    radial-gradient(280px 200px at 50% 20%, rgba(var(--tint-lite-rgb),var(--mesh-a2)), transparent 64%),
    radial-gradient(300px 210px at 6% -10%, var(--lift), transparent 60%),
    radial-gradient(300px 240px at 100% 2%, rgba(var(--tint-rgb),var(--mesh-a)), transparent 62%),
    radial-gradient(340px 280px at 10% 110%, rgba(var(--tint-rgb),var(--mesh-a)), transparent 60%),
    radial-gradient(280px 220px at 92% 98%, rgba(var(--tint-lite-rgb),var(--mesh-a2)), transparent 64%);
}
/* 유리판 */
.pane{
  position:relative;z-index:2;flex:1;
  display:flex;flex-direction:column;
  border-radius:20px;overflow:hidden;
  background:
    linear-gradient(180deg,var(--sheen) 0%,transparent 34%),
    var(--glass);
  -webkit-backdrop-filter:blur(26px) saturate(175%);
          backdrop-filter:blur(26px) saturate(175%);
  box-shadow:inset 0 1px 0 var(--glass-hi);
}

/* ── 헤더 ── */
.hd{
  position:relative;flex:none;
  display:flex;align-items:center;justify-content:center;
  padding:14px 16px;
  border-bottom:1px solid var(--hairline);
  -webkit-app-region:drag;
}
.hd b{
  font-size:11px;font-weight:700;letter-spacing:.19em;
  color:var(--ink-3);padding-left:.19em;
}
.x{
  position:absolute;right:11px;top:50%;transform:translateY(-50%);
  width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;
  border:1px solid var(--glass-line);
  background:var(--glass-inner);
  box-shadow:inset 0 1px 0 var(--glass-hi);
  color:var(--ink-3);
  -webkit-app-region:no-drag;
  transition:color .18s ease,background .18s ease,transform .18s ease;
}
.x svg{width:11px;height:11px;display:block}
.x:hover{color:var(--ink);background:var(--glass-solid);transform:translateY(-50%) rotate(90deg)}

/* ── 본문 ── */
.bd{
  flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:24px 24px 22px;
}

/* 아이콘 — 유리 액자(mark-badge) 안에 원본 PNG 그대로 */
.mark{position:relative;display:grid;place-items:center;margin-bottom:16px}
.mark::before{                                   /* 뒤에서 퍼지는 브랜드 글로우 */
  content:"";position:absolute;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle,rgba(var(--tint-rgb),.34) 0%,transparent 66%);
  filter:blur(12px);opacity:.85;
}
.mark::after{                                    /* 바닥에 깔리는 접지 그림자 */
  content:"";position:absolute;bottom:-9px;width:70px;height:13px;border-radius:50%;
  background:radial-gradient(ellipse,var(--tint-deep) 0%,transparent 72%);
  opacity:.32;filter:blur(5px);
}
.badge{
  position:relative;width:104px;height:104px;border-radius:27px;
  display:grid;place-items:center;
  background:
    linear-gradient(155deg,rgba(255,255,255,.34),transparent 42%),
    color-mix(in srgb,var(--tint) 15%,var(--glass-solid));
  -webkit-backdrop-filter:blur(14px) saturate(200%);
          backdrop-filter:blur(14px) saturate(200%);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.6),
    inset 0 0 0 1px color-mix(in srgb,var(--tint) 22%,transparent),
    inset 0 -10px 20px -13px var(--tint-deep),
    0 1px 2px rgba(18,28,54,.10),
    0 18px 30px -14px var(--tint-deep),
    0 34px 52px -30px rgba(18,28,54,.55);
  transition:transform .5s cubic-bezier(.22,1,.36,1);
}
.badge:hover{transform:translateY(-4px) rotate(-2deg)}
.badge img{                                      /* 원본 아이콘 — 재도색 없음 */
  width:82px;height:82px;display:block;border-radius:20px;
  box-shadow:var(--ico-sh);
}
.badge::after{                                   /* 액자 좌상단에만 스치는 광택 */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(128deg,rgba(255,255,255,.85) 0%,rgba(255,255,255,.24) 15%,transparent 34%);
  mix-blend-mode:overlay;opacity:.8;
}

/* 이름 / 버전 — 다운로드 페이지 masthead(.eyebrow + h1 span 그라디언트)의 축소판 */
.eyebrow{
  font-size:9px;font-weight:700;letter-spacing:.42em;
  color:var(--ink-3);padding-left:.42em;margin-bottom:9px;
  text-transform:uppercase;
}
.name{
  font-size:24px;font-weight:900;letter-spacing:-.045em;line-height:1.05;
  color:var(--ink);margin-bottom:12px;
}
.name span{
  background:var(--name-grad);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
}
.ver{
  display:inline-flex;align-items:center;
  font-size:11.5px;font-weight:700;letter-spacing:.055em;
  font-variant-numeric:tabular-nums;
  padding:5px 13px;border-radius:999px;
  color:var(--tint-ink);
  background:var(--glass-inner);
  border:1px solid color-mix(in srgb,var(--tint) 26%,transparent);
  box-shadow:inset 0 1px 0 var(--glass-hi);
  margin-bottom:18px;
}
/* 가운데만 진하고 양끝이 사라지는 헤어라인 — 다운로드 페이지 .sec-head .rule 감각 */
.rule{
  width:100%;height:1px;margin-bottom:16px;
  background:linear-gradient(90deg,transparent 0%,var(--hairline) 18%,var(--hairline) 82%,transparent 100%);
}

.desc{font-size:13px;line-height:1.78;color:var(--ink-2);font-weight:500;margin-bottom:12px}
.copy{font-size:10.5px;line-height:1.5;color:var(--ink-3);letter-spacing:0}

/* ── 업데이트 액션 ── */
.act{display:flex;flex-direction:column;align-items:center;gap:9px;margin-top:19px;width:100%}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  font-family:inherit;font-size:13px;font-weight:800;letter-spacing:-.02em;
  color:#fff;border:none;cursor:pointer;
  padding:11px 22px;border-radius:13px;
  background:var(--tint-grad);
  text-shadow:0 1px 2px rgba(0,0,0,.26);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.34),
    0 2px 4px rgba(18,28,54,.14),
    0 13px 24px -11px var(--tint-deep);
  transition:transform .2s ease,box-shadow .26s ease,filter .2s ease;
}
.btn svg{width:15px;height:15px;flex:none;transition:transform .3s ease}
.btn:hover{
  transform:translateY(-2px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34),0 2px 4px rgba(18,28,54,.14),0 20px 34px -11px var(--tint-deep);
}
.btn:hover svg{transform:rotate(120deg)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.55;transform:none;cursor:default;filter:saturate(.7)}
.st{
  font-size:11px;line-height:1.55;color:var(--ink-3);
  max-width:250px;min-height:0;
}

/* ⚠️ 이 padding = 창 안에서 그림자가 번질 수 있는 유일한 여백이다.
   창(Electron transparent+frame:false)은 .dlg 크기 + 이 padding 만큼만 잡히고,
   그 밖으로 나간 box-shadow 픽셀은 OS 창 경계에서 "직선으로" 싹둑 잘린다.
   padding:10px일 때 그림자가 아래로 50px 넘게 뻗어서 카드 밑 10px 지점에서
   아직 진한 채로 수평 직선으로 끊겼음 — 이게 "모서리가 각져 보인다"의 진짜 원인
   (2026-08-25 K-Clock에서 확정, 같은 CSS를 쓰는 이 파일에도 동일 적용).
   값을 바꿀 땐 반드시 실제 렌더에서 가장자리 알파가 0인지 재볼 것.
   현재 소요량 실측(다크): 아래 38px / 옆 23px / 위 8px. */
body{background:transparent;padding:16px 28px 44px;}

/* ── per-app brand tint — K-Tube 아이콘 PNG에서 직접 추출 ──
   --tint-lite : 아이콘 그라디언트 밝은 끝   #F6C6B9
   --tint      : 아이콘 본체 대표 채도색     #AF4836
   --tint-deep : 우하단 K배지 글자색         #7E1B10                       */
:root{
  --tint:#AF4836;
  --tint-lite:#F6C6B9;
  --tint-deep:#7E1B10;
  --tint-rgb:175,72,54;
  --tint-lite-rgb:246,198,185;
  --tint-ink:#AF4836;
  --tint-grad:linear-gradient(140deg,#AF4836 0%,#912C1E 52%,#7E1B10 100%);
  --name-grad:linear-gradient(135deg,#AF4836 0%,#7E1B10 100%);
}
:root[data-theme="dark"],:root[data-theme="midnight"]{
  --tint-ink:#F7CDC1;
  --name-grad:linear-gradient(135deg,#F6C6B9 0%,#D68D7E 100%);
}

/* ── ember 스킨: 라이트 토큰 위에 바닥색만 교체 ── */
:root[data-theme="ember"]{
  --ground:#EBDFC6; --ground-2:#DDCDAA;
  --glass:rgba(255,252,244,.52);
  --glass-solid:rgba(255,252,244,.80);
  --glass-inner:rgba(255,252,244,.44);
  --glass-line:rgba(56,40,16,.16);
  --glass-hi:rgba(255,250,238,.86);
  --hairline:rgba(56,40,16,.14);
  --ink:#372A18; --ink-2:#6B5636; --ink-3:#927A54;
  --lift:rgba(255,250,238,.90);
}

/* ── midnight 스킨: 다크 토큰 + 앰버 바닥 ── */
:root[data-theme="midnight"]{
  --ground:#241A11; --ground-2:#150E07;
  --glass:rgba(255,220,150,.055);
  --glass-solid:rgba(255,220,150,.10);
  --glass-inner:rgba(255,220,150,.05);
  --glass-line:rgba(255,220,150,.14);
  --glass-hi:rgba(255,220,150,.13);
  --hairline:rgba(255,220,150,.10);
  --ink:#EAD6AE; --ink-2:#C0A574; --ink-3:#8C7548;
  --lift:rgba(255,220,150,.06);
}
</style>
<script>
(function(){
  var t = new URLSearchParams(location.search).get('theme');
  if (t) document.documentElement.setAttribute('data-theme', t);
})();
</script>

        <button class="btn" id="update-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>업데이트 확인</button>
        <span class="st" id="update-status"></span>
      </div>

<script>
window.api.getAppVersion().then(v => { document.getElementById('ver').textContent = 'v' + v;  /* K-시리즈 About 버전 표기는 'v1.2.3' 형식으로 통일(2026-08-25) */ });
const btn = document.getElementById('update-btn');
const status = document.getElementById('update-status');

function doResize() {
  requestAnimationFrame(() => {
    // 예전엔 document.body의 높이를 쟀는데 html,body{height:100%}라 body 높이는
    // "현재 창 높이" 그 자체였음 — 그걸 +4 해서 되돌려주니 호출될 때마다 창이 4px씩
    // 계속 커지는 누적 버그였고, 동시에 카드 실제 높이를 전혀 반영하지 못했다.
    // 카드(.dlg) 실측 높이 + body 상하 padding으로 정확히 계산한다(2026-08-25).
    const cs = getComputedStyle(document.body);
    const pt = parseFloat(cs.paddingTop) || 0, pb = parseFloat(cs.paddingBottom) || 0;
    const h = document.querySelector('.dlg').getBoundingClientRect().height + pt + pb;
    window.api.resizeAbout(Math.ceil(h));
  });
}

btn.onclick = () => {
  btn.disabled = true;
  status.textContent = '확인 중...';
  doResize();
  window.api.checkForUpdates().then(res => {
    if (res === 'dev') {
      btn.disabled = false;
      status.textContent = '개발 모드에서는 확인할 수 없어요.';
      doResize();
    }
  });
};
window.api.onUpdateAvailable(() => { btn.disabled = false; status.textContent = '새 버전 발견, 다운로드 중...'; doResize(); });
window.api.onUpdateNotAvailable(() => { btn.disabled = false; status.textContent = '최신 버전 사용 중입니다.'; doResize(); });
window.api.onUpdateError((_, msg) => { btn.disabled = false; status.textContent = '업데이트 확인 실패: ' + (msg || '알 수 없는 오류') + ' (잠시 후 다시 시도해주세요)'; doResize(); });
window.api.onUpdateDownloaded(() => { status.textContent = '다운로드 완료! 재시작하면 설치돼요.'; doResize(); });
window.api.onThemeChanged((theme) => { document.documentElement.setAttribute('data-theme', theme); doResize(); });
window.addEventListener('load', doResize);
</script>
