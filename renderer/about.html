<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>K-Tube 정보</title>
<style>
:root {
  --bg: #222; --bg2: #2a2a2a; --bg3: #3a3a3e; --border: #2d2d2d;
  --text: #f0f0f0; --text2: #ccc; --text3: #888;
}
[data-theme="light"] {
  --bg: #f0f0f0; --bg2: #ffffff; --bg3: #e8e8e8; --border: #cccccc;
  --text: #111111; --text2: #444444; --text3: #777777;
}
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: var(--bg); font-family: 'Segoe UI','맑은 고딕',sans-serif; width: 100%; display: flex; flex-direction: column; overflow: hidden; }
.header { padding: 14px 16px; position: relative; text-align: center; border-bottom: 1px solid var(--border); flex-shrink: 0; -webkit-app-region: drag; }
.header span { font-size: 14px; font-weight: 700; color: var(--text); }
.close-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; background: var(--bg3); border: none; border-radius: 50%; color: var(--text3); font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; -webkit-app-region: no-drag; }
.close-btn:hover { background: #e74c3c; color: #fff; }
.body { padding: 24px 20px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; flex: 1; }
.app-icon { width: 84px; height: 84px; margin-bottom: 16px; border-radius: 20px; overflow: hidden; }
.app-icon img { width: 100%; height: 100%; display: block; }
.app-name { font-size: 18px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
.app-version { font-size: 12px; color: var(--text3); margin-bottom: 16px; }
.divider { width: 100%; height: 1px; background: var(--border); margin-bottom: 14px; }
.app-desc { font-size: 13px; color: var(--text2); line-height: 1.8; margin-bottom: 14px; }
.app-copyright { font-size: 11px; color: var(--text3); }
.actions { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 18px 0 22px; }
.update-btn { background: var(--bg3); color: var(--text2); border: none; border-radius: 8px; padding: 7px 16px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }
.update-btn:hover { opacity: 0.85; }
.update-btn:disabled { opacity: 0.6; cursor: default; }
.update-status { font-size: 11px; color: var(--text3); max-width: 260px; text-align: center; }
</style>
<script>
(function() {
  const theme = new URLSearchParams(window.location.search).get('theme');
  if (theme) document.documentElement.setAttribute('data-theme', theme);
})();
</script>

<div class="actions">
  <button class="update-btn" id="update-btn">업데이트 확인</button>
  <span class="update-status" id="update-status"></span>
</div>
</div>
<script>
window.api.getAppVersion().then(v => { document.getElementById('ver').textContent = '버전 ' + v; });
const btn = document.getElementById('update-btn');
const status = document.getElementById('update-status');

function doResize() {
  requestAnimationFrame(() => {
    const h = document.body.getBoundingClientRect().height;
    window.api.resizeAbout(h + 4);
  });
}

btn.onclick = () => {
  btn.disabled = true;
  status.textContent = '확인 중...';
  doResize();
  window.api.checkForUpdates().then(res => {
    if (res === 'dev') {
      btn.disabled = false;
      status.textContent = '개발 모드에서는 확인할 수 없어요.';
      doResize();
    }
  });
};
window.api.onUpdateAvailable(() => { btn.disabled = false; status.textContent = '새 버전 발견, 다운로드 중...'; doResize(); });
window.api.onUpdateNotAvailable(() => { btn.disabled = false; status.textContent = '최신 버전 사용 중입니다.'; doResize(); });
window.api.onUpdateError(() => { btn.disabled = false; status.textContent = '업데이트 확인 실패, 잠시 후 다시 시도해주세요.'; doResize(); });
window.api.onUpdateDownloaded(() => { status.textContent = '다운로드 완료! 재시작하면 설치돼요.'; doResize(); });
window.api.onThemeChanged((theme) => { document.documentElement.setAttribute('data-theme', theme); doResize(); });
window.addEventListener('load', doResize);
</script>
